name: build

on: [push]

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Install JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'microsoft'
- name: Make gradlew executable
run: chmod +x ./gradlew
- name: Build
run: ./gradlew build
- name: Upload artifact
uses: actions/upload-artifact@v4
with:
name: necromancer-mod
path: build/libs/
